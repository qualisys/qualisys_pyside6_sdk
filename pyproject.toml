[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qtm-rt-pyside6"
dynamic = ["version"]
description = "PySide6 SDK for QTM Real-Time Protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]
requires-python = ">=3.10"
authors = [{ name = "Qualisys AB", email = "support@qualisys.com" }]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
# QtCore / QtGui / QtNetwork / QtQml / QtQuick / QtQuickControls2 are all in
# PySide6-Essentials. Qt Quick 3D (the scene extra) is in PySide6-Addons, which
# pins Essentials to its own version, so pip keeps the two in lockstep.
#
# PySide6 6.12.0's Linux wheels are built against Python 3.12 headers but install
# on 3.10/3.11 (PYSIDE-3474). There, Signal.emit(), disconnect() and void methods
# drop a reference to True/False/None, and the app aborts once one reaches zero
# ("free(): invalid pointer"). The Windows wheels are unaffected; macOS is
# untested, so it keeps the older PySide6 too.
dependencies = [
    "PySide6-Essentials>=6.5",
    "PySide6-Essentials<6.12; python_version < '3.12' and sys_platform != 'win32'",
    "qtm-rt>=3.0.0",
]

[project.optional-dependencies]
scene = ["PySide6-Addons>=6.5"]

[project.entry-points.pyinstaller40]
hook-dirs = "qtm_rt_pyside6.__pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "https://github.com/qualisys/qualisys_pyside6_sdk"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools]
# Package data is listed below; the QML directory is data, not a namespace package
include-package-data = false

[tool.setuptools.packages.find]
include = ["qtm_rt_pyside6*"]
namespaces = false

[tool.setuptools.package-data]
"qtm_rt_pyside6.scene" = ["qml/Qualisys/Scene/qmldir", "qml/Qualisys/Scene/*.qml"]
"qtm_rt_pyside6.__pyinstaller" = ["hook-*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg — common Qt pattern (QModelIndex())
    "SIM108", # ternary operator — not always more readable
]
