name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.x"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: |
          pip install -r requirements-dev.txt
          pip install -e ".[scene]"
      # pyproject.toml keeps PySide6 below 6.12 on Linux with Python 3.10/3.11
      # (PYSIDE-3474), where 6.12.0 aborts the test run at exit
      - name: Check the PySide6 version
        run: |
          python - <<'PY'
          import sys
          import PySide6
          version = tuple(int(part) for part in PySide6.__version__.split(".")[:2])
          print("Python", sys.version.split()[0], "PySide6", PySide6.__version__)
          assert sys.version_info >= (3, 12) or version < (6, 12), "PySide6 6.12 on Python < 3.12"
          PY
      - run: pytest -v -rs

  # The core and the scene data layer must work without PySide6-Addons
  test-core-only:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - run: python -c "import importlib.util as u; assert u.find_spec('PySide6.QtQuick3D') is None, 'Addons installed'"
      - run: pytest -v -rs
